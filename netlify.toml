[build]
  publish = "dist"
  command = "npm run build"

# Route API requests to Netlify Serverless Functions
[[redirects]]
  from = "/api/parse-schedule"
  to = "/.netlify/functions/parse-schedule"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Fallback clean routing for Single Page Application
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
